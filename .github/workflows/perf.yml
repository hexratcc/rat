name: perf

on:
  workflow_run:
    workflows: ['test (ubuntu-latest)']
    types: [completed]
  workflow_dispatch:
    inputs:
      commits:
        description: 'commits to plot'
        default: '100'

concurrency:
  group: perf
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  graph:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: self-hosted
    timeout-minutes: 720

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: renderer
        run: python -m pip install --quiet matplotlib

      - name: restore cache
        run: git fetch -q origin perf || echo "no perf branch yet, starting from scratch"

      - name: graph
        run: python src/compiler/bench/perf.py "${{ inputs.commits || 100 }}"

      # publish as a single parentless commit, on its own branch
      - name: publish
        if: github.event_name == 'workflow_run' || github.ref == 'refs/heads/main'
        run: |
          GIT_INDEX_FILE=$(mktemp) && export GIT_INDEX_FILE
          git read-tree --empty
          git update-index --add --cacheinfo 100644,"$(git hash-object -w assets/perf.png)",perf.png
          git update-index --add --cacheinfo 100644,"$(git hash-object -w assets/perf.tsv)",perf.tsv
          commit=$(git -c user.name='nella' -c user.email='simontupy64@gmail.com' \
                       commit-tree "$(git write-tree)" -m "perf graph for ${GITHUB_SHA:0:12}")
          git push -f origin "$commit:refs/heads/perf"
