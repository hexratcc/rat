name: test (ubuntu-latest)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: toolchain versions
        run: |
          g++ --version
          cc --version

      - name: build
        run: make -j"$(nproc)"

      - name: test
        run: make test
